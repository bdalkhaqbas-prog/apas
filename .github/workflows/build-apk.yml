name: Build Android APK (@qs_66)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Game Files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Android Build Tools 33.0.2
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Setup Cordova & Project Files
        run: |
          npm install -g cordova
          cordova create build_app com.qs66.harb "حرب"
          
          # تنظيف ونسخ ملفات اللعبة الأربعة
          rm -rf build_app/www/*
          cp index.html build_app/www/
          [ -f "style.css" ] && cp style.css build_app/www/ || true
          [ -f "lobby.js" ] && cp lobby.js build_app/www/ || true
          [ -f "combat.js" ] && cp combat.js build_app/www/ || true

          # ضبط الوضع العرضي وملء الشاشة
          sed -i 's|</widget>|    <preference name="Orientation" value="landscape" />\n    <preference name="Fullscreen" value="true" />\n</widget>|' build_app/config.xml

      - name: Build Android APK
        working-directory: ./build_app
        run: |
          cordova platform add android@12.0.1
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harb-Game-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
