name: Build APK (KivyMD)

on: [workflow_dispatch]

​jobs:

build:

runs-on: ubuntu-latest

steps:

- name: Checkout Code

uses: actions/checkout@v4

​- name: Rename app.py to main.py (if exists)

run: cp app.py main.py || true

​- name: Setup Python

uses: actions/setup-python@v5

with:

python-version: '3.11'

​- name: Setup Java (Required for Android SDK)

uses: actions/setup-java@v4

with:

distribution: 'zulu'

java-version: '17'

​- name: Install System Dependencies for Buildozer

run: |

sudo apt update

sudo apt install -y build-essential git python3-dev libffi-dev libssl-dev libltdl-dev zip unzip autoconf automake libtool gettext

​- name: Install Buildozer and Cython

run: |

python -m pip install --upgrade pip

pip install buildozer cython virtualenv

​- name: Build APK using Buildozer

run: yes | buildozer android debug

​- name: Upload APK Artifact

uses: actions/upload-artifact@v4

with:

name: Abbas-App-APK

path: bin/*.apk

